[package]
name = "blankslate-hud"
version = "0.1.0"
description = "BlankSlate HUD - local-first voice assistant overlay"
authors = ["BlankSlate contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "blankslate_hud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
url = "2"
dirs = "5"
log = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"

[profile.release]
panic = "abort"
strip = true