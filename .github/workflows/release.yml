name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: daemon/pyproject.toml

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: hud/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "hud/src-tauri -> target"

      - name: Cache frozen daemon (PyInstaller output)
        id: daemon-cache
        uses: actions/cache@v4
        with:
          path: daemon/dist/BlankslateDaemon
          key: daemon-freeze-${{ hashFiles('daemon/src/**/*', 'daemon/blankslate.spec', 'daemon/pyproject.toml', 'daemon/build_daemon.ps1', 'daemon/pyinstaller/**/*') }}

      - name: Install daemon and PyInstaller
        run: |
          cd daemon
          pip install -e ".[dev]"
        shell: bash

      - name: Freeze daemon with PyInstaller
        if: steps.daemon-cache.outputs.cache-hit != 'true'
        run: ./build_daemon.ps1
        working-directory: daemon
        shell: pwsh

      - name: Restore frozen daemon into resources
        if: steps.daemon-cache.outputs.cache-hit == 'true'
        run: |
          $dst = "hud/src-tauri/resources/daemon"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Recurse -Force "daemon/dist/BlankslateDaemon/*" $dst
        shell: pwsh

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: hud

      - name: Build HUD installer
        run: pnpm tauri build --verbose
        working-directory: hud

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            hud/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  # P8: gate the release on a real, headless end-to-end check. Boots the daemon's
  # agent stack, starts a local Ollama (first-run fetch), sends a canned prompt
  # through send_text, and asserts a real LLM response arrives within a timeout.
  # This proves the engine answers (not just that the process starts) before we
  # publish.
  smoke-test:
    name: Headless LLM smoke test
    runs-on: windows-latest
    needs: build-installer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: daemon/pyproject.toml

      - name: Install daemon (dev)
        run: |
          cd daemon
          pip install -e ".[dev]"
        shell: bash

      - name: Run headless send_text smoke test
        env:
          BLANKSLATE_SMOKE_DIR: ${{ runner.temp }}\blankslate-smoke
        run: python -m tests.smoke_send_text
        working-directory: daemon
        shell: bash

  publish:
    name: Publish release assets
    runs-on: windows-latest
    needs: [build-installer, smoke-test]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: installer

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/*.msi
          fail_on_unmatched_files: false
