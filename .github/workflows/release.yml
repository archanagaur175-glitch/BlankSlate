name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependencies-path: daemon/pyproject.toml

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "hud/src-tauri -> target"

      - name: Cache frozen daemon (PyInstaller output)
        id: daemon-cache
        uses: actions/cache@v4
        with:
          path: daemon/dist/BlankslateDaemon
          key: daemon-freeze-${{ hashFiles('daemon/src/**/*', 'daemon/blankslate.spec', 'daemon/pyproject.toml', 'daemon/build_daemon.ps1', 'daemon/pyinstaller/**/*') }}

      - name: Install daemon and PyInstaller
        run: |
          cd daemon
          pip install -e ".[dev]"
        shell: bash

      - name: Freeze daemon with PyInstaller
        if: steps.daemon-cache.outputs.cache-hit != 'true'
        run: ./build_daemon.ps1
        working-directory: daemon
        shell: pwsh

      - name: Restore frozen daemon into resources
        if: steps.daemon-cache.outputs.cache-hit == 'true'
        run: |
          $dst = "hud/src-tauri/resources/daemon"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Recurse -Force "daemon/dist/BlankslateDaemon/*" $dst
        shell: pwsh

      - name: Download bundled Ollama (Windows portable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dest = "hud/src-tauri/resources/ollama"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          try {
            $tag = (gh release list --repo ollama/ollama --limit 1 --json tagName --jq '.[0].tagName').Trim()
            if (-not $tag) { throw "empty tag" }
          } catch {
            Write-Warning "could not resolve latest ollama tag via gh ($_); using pinned version"
            $tag = "v0.11.0"
          }
          $url = "https://github.com/ollama/ollama/releases/download/$tag/ollama-windows-amd64.zip"
          Write-Output "Downloading Ollama $tag from $url"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\ollama.zip"
          Expand-Archive -Path "$env:TEMP\ollama.zip" -DestinationPath $dest -Force
          Remove-Item -Force "$env:TEMP\ollama.zip"
          if (-not (Test-Path "$dest/ollama.exe")) { throw "ollama.exe not found after extraction" }
          Write-Output "Ollama bundled at $dest"
          exit 0
        shell: pwsh

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: hud

      - name: Build HUD installer
        run: pnpm tauri build
        working-directory: hud

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hud/src-tauri/target/release/bundle/msi/*.msi
            hud/src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: false
