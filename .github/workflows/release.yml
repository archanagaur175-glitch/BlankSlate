name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install daemon and PyInstaller
        run: |
          cd daemon
          pip install -e ".[dev]"
        shell: bash

      - name: Freeze daemon with PyInstaller
        run: ./build_daemon.ps1
        working-directory: daemon
        shell: pwsh

      - name: Download bundled Ollama (Windows portable)
        run: |
          $dest = "hud/src-tauri/resources/ollama"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $tag = (Invoke-RestMethod https://api.github.com/repos/ollama/ollama/releases/latest).tag_name
          $url = "https://github.com/ollama/ollama/releases/download/$tag/ollama-windows-amd64.zip"
          Write-Output "Downloading Ollama $tag from $url"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\ollama.zip"
          Expand-Archive -Path "$env:TEMP\ollama.zip" -DestinationPath $dest -Force
          Remove-Item -Force "$env:TEMP\ollama.zip"
          Write-Output "Ollama bundled at $dest"
        shell: pwsh

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: hud

      - name: Build HUD installer
        run: pnpm tauri build
        working-directory: hud

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hud/src-tauri/target/release/bundle/msi/*.msi
            hud/src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: false
